name: Sync Approved CRM Tickets to Todoist

on:
  issues:
    types: [labeled]

jobs:
  create-todoist-task:
    if: github.event.label.name == 'approved' || github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - name: Create Task in Todoist
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "$TODOIST_API_TOKEN" ]; then
            echo "::warning::TODOIST_API_TOKEN secret is not set. Skipping Todoist task creation."
            exit 0
          fi

          # Prepare payload using Python for safe JSON escaping
          python3 -c "
          import os, json, urllib.request

          token = os.environ['TODOIST_API_TOKEN']
          title = os.environ.get('ISSUE_TITLE', 'Workflow Request')
          url = os.environ.get('ISSUE_URL', '')
          number = os.environ.get('ISSUE_NUMBER', '')
          body = os.environ.get('ISSUE_BODY', '')

          # Truncate body if excessively long for task description
          snippet = (body[:280] + '...') if len(body) > 280 else body

          task_data = {
              'content': f'AVD Request #{number}: {title}',
              'description': f'GitHub Issue: {url}\n\nDetails:\n{snippet}',
              'due_string': 'in 3 days'
          }

          req = urllib.request.Request(
              'https://api.todoist.com/api/v1/tasks',
              data=json.dumps(task_data).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  print(f'Successfully created Todoist task: {result.get(\"id\")}')
          except Exception as e:
              print(f'Error creating Todoist task: {e}')
              raise e
          "

      - name: Comment on GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🎉 **Request Accepted!** This item has been approved and synced into the developer Todoist backlog for development and testing."
            })
